<section class="login-shell">
  <div class="login-card">
    <header>
      <h1>{{ 'login.title' | translate }}</h1>
      @if (isAuthEnabled()) {
        <p>{{ 'login.signInOrg' | translate }}</p>
      } @else {
        <p>{{ 'login.localDevMode' | translate }}</p>
      }
    </header>

    @if (error()) {
      <p class="login-error">{{ error() | translate }}</p>
    }

    <button type="button" (click)="login()" [disabled]="isLoading()">
      @if (isLoading()) {
        {{ 'login.signingIn' | translate }}
      } @else {
        {{ isAuthEnabled() ? ('login.signIn' | translate) : ('login.continue' | translate) }}
      }
    </button>
    <button type="button" class="secondary" (click)="backToApp()">{{ 'login.backToApp' | translate }}</button>
  </div>
</section>
