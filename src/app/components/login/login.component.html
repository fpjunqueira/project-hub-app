<section class="login-shell">
  <div class="login-card">
    <header>
      <h1>{{ 'login.title' | translate }}</h1>
      @if (isAuthEnabled()) {
        <p>{{ 'login.signInOrg' | translate }}</p>
      } @else {
        <p>{{ 'login.localDevMode' | translate }}</p>
      }
    </header>

    @if (isAuthEnabled()) {
      <button type="button" (click)="login()" [disabled]="isLoading()">
        @if (isLoading()) {
          {{ 'login.signingIn' | translate }}
        } @else {
          {{ 'login.signIn' | translate }}
        }
      </button>
    } @else {
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">{{ 'login.username' | translate }}</label>
          <input
            id="username"
            type="text"
            [value]="username()"
            (input)="username.set($any($event.target).value)"
            [placeholder]="'login.usernamePlaceholder' | translate"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">{{ 'login.password' | translate }}</label>
          <input
            id="password"
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            [placeholder]="'login.passwordPlaceholder' | translate"
            autocomplete="current-password"
            required
          />
        </div>
        @if (error()) {
          <p class="login-error">{{ error() | translate }}</p>
        }
        <button type="submit" [disabled]="isLoading() || !username() || !password()">
          @if (isLoading()) {
            {{ 'login.signingIn' | translate }}
          } @else {
            {{ 'login.continue' | translate }}
          }
        </button>
      </form>
    }
  </div>
</section>
